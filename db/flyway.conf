# sessionVariables runs every Flyway session on bank time (Sri Lanka, +05:30) even when the MySQL
# server is on UTC, so NOW()/CURDATE() in migrations and seeds and the time zone of CREATE EVENT
# match the backend. Supported by the MariaDB Connector/J bundled with Flyway and by MySQL Connector/J.
flyway.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&sessionVariables=time_zone='+05:30'
flyway.user=${DB_USER}
flyway.password=${DB_PASSWORD}
flyway.locations=filesystem:db/migrations,filesystem:db/seeds