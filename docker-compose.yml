services:
  database:
    image: mysql:8.0
    container_name: mims_db
    restart: always
    command: --log-bin-trust-function-creators=1 --event-scheduler=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:10
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:mysql://database:3306/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_LOCATIONS: "filesystem:/flyway/sql/migrations,filesystem:/flyway/sql/seeds"
    volumes:
      - ./db/migrations:/flyway/sql/migrations:ro
      - ./db/seeds:/flyway/sql/seeds:ro
    depends_on:
      database:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: mims_backend
    restart: always
    command: npm run dev
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "5000:5000"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      flyway:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: mims_frontend
    restart: always
    command: sh -c "npm install --include=optional --no-package-lock && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
